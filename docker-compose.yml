# Local PostgreSQL for development and integration tests.
name: ember-oak
# Port 5433 avoids clashing with other Postgres instances on the default 5432.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ember
      POSTGRES_PASSWORD: ember
      POSTGRES_DB: ember_oak
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ember -d ember_oak"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
